name: Publish PayIncus Integration

on:
  workflow_run:
    workflows: [PayIncus Integration]
    types: [completed]
    branches: [canary]

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'canary' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: payincus-linux-*
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify distribution, architecture and source provenance
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for target in ubuntu-24.04 ubuntu-26.04 debian-13; do
            for arch in amd64 arm64; do
              (cd "release/payincus-linux-$target-$arch" && sha256sum --check SHA256SUMS)
            done
          done
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import itertools
          for target, arch in itertools.product(("ubuntu-24.04", "ubuntu-26.04", "debian-13"), ("amd64", "arm64")):
              folder = Path("release") / f"payincus-linux-{target}-{arch}"
              manifests = list(folder.glob("*.manifest.json"))
              assert len(manifests) == 1, "expected one source manifest"
              data = json.loads(manifests[0].read_text())
              assert data["sourceCommit"] == os.environ["EXPECTED_SHA"]
              assert data["architecture"] == arch
              assert data["targetDistribution"] == target
              assert data["upstreamCommit"] == "01f81e5e607bbb5818410318e4b3496ad1820824"
              assert data["channel"] == "canary"
          PY
      - name: Publish immutable integration prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          tag="canary-$(cat scripts/payincus/VERSION)-${SOURCE_SHA:0:12}"
          # Derive the matrix from the downloaded artifacts instead of repeating a
          # hard-coded list: every build job publishes one SHA256SUMS per folder,
          # and any target this step forgets would upload a duplicate asset name.
          for folder in release/payincus-linux-*; do
            target="$(basename "$folder")"
            mv "$folder/SHA256SUMS" "$folder/SHA256SUMS-${target#payincus-linux-}"
          done
          cp scripts/payincus/RELEASE-NOTES.md release-notes.md
          printf '\nSource: %s\nValidated CI: %s\n' "$SOURCE_SHA" "$CI_URL" >> release-notes.md
          gh release create "$tag" --target "$SOURCE_SHA" --prerelease \
            --title "Incus $(cat scripts/payincus/VERSION) canary ${SOURCE_SHA:0:12}" \
            --notes-file release-notes.md release/payincus-linux-*/*
