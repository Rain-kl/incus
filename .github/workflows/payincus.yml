name: PayIncus Integration

on:
  push:
    branches: [main, canary]
    tags: ['payincus-v*']
  pull_request:
    branches: [main, canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payincus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository != 'lxc/incus'
    name: Integration (${{ matrix.target }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: ubuntu-24.04
            image: ubuntu:24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: ubuntu-24.04
            image: ubuntu:24.04
          - arch: amd64
            runner: ubuntu-24.04
            target: debian-13
            image: debian:13
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: debian-13
            image: debian:13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 build-essential pkg-config libcowsql-dev liblxc-dev libsqlite3-dev \
            libcap-dev libudev-dev libacl1-dev libseccomp-dev libselinux1-dev \
            iproute2 rsync attr squashfs-tools xz-utils dpkg-dev shellcheck
      - name: Verify released LTS baseline
        run: |
          git fetch --no-tags https://github.com/lxc/incus.git refs/tags/v7.0.2:refs/tags/v7.0.2
          git cat-file -e v7.0.2^{commit}
          test "$(git rev-parse v7.0.2^{commit})" = 01f81e5e607bbb5818410318e4b3496ad1820824
          git merge-base --is-ancestor v7.0.2 HEAD
      - name: Prepare pinned Xray
        run: python3 scripts/payincus/prepare-xray.py "${{ matrix.arch }}"
      - name: Extension and connector contracts (race detector)
        run: go test -race ./internal/server/payincus/... ./cmd/payincus-agent ./cmd/payincus-network-worker
      - name: Real systemd and native proxy API recovery
        if: matrix.arch == 'amd64' && matrix.target == 'debian-13'
        timeout-minutes: 10
        run: bash scripts/payincus/test-egress-systemd.sh
      - name: Real daemon API integration and upstream daemon unit tests
        run: |
          # Compile as the runner; only executing daemon tests requires root.
          go test -c -tags libsqlite3 -o "$RUNNER_TEMP/payincus-incusd.test" ./cmd/incusd
          sudo "$RUNNER_TEMP/payincus-incusd.test" -test.v -test.count=1
      - name: Upstream client and shared unit tests
        run: CGO_ENABLED=0 go test ./cmd/incus/... ./shared/...
      - name: Terminal UI contracts
        working-directory: tools/incus-tui
        run: |
          go test -race ./...
          go vet ./...
      - name: Native ZFS and proxy data paths in isolated VMs
        if: matrix.arch == 'amd64' && matrix.target == 'debian-13'
        timeout-minutes: 25
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/security.test" ./internal/server/payincus/security
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/egress.test" ./internal/server/payincus/egress
          docker run --rm -v "$PWD:/source:ro" -v "$RUNNER_TEMP/security.test:/tests/security.test:ro" -v "$RUNNER_TEMP/egress.test:/tests/egress.test:ro" debian:13 sh -ec '
            sed -i "s/Components: main/Components: main contrib/g" /etc/apt/sources.list.d/debian.sources
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              qemu-system-x86 linux-image-amd64 linux-headers-amd64 zfs-dkms zfsutils-linux busybox-static cpio kmod iproute2 nftables util-linux python3
            bash /source/scripts/payincus/test-zfs-vm.sh /tests/security.test
            bash /source/scripts/payincus/test-egress-vm.sh /tests/egress.test
          '
      - name: Installer contracts
        run: python3 scripts/payincus/test-install.py
      - name: Packaging script checks
        run: |
          bash -n scripts/payincus/{build,build-debian,package,install,test-zfs-vm,test-egress-systemd,test-egress-vm}.sh
          shellcheck scripts/payincus/{build,build-debian,package,install,test-zfs-vm,test-egress-systemd,test-egress-vm}.sh
      - name: Build integrated binaries
        if: matrix.target == 'ubuntu-24.04'
        run: bash scripts/payincus/build.sh
      - name: Assemble native integration packages
        if: matrix.target == 'ubuntu-24.04'
        env:
          RELEASE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/payincus/package.sh
      - name: Build and package on Debian 13
        if: matrix.target == 'debian-13'
        env:
          RELEASE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker run --rm -v "$PWD:/source" -w /source \
            -v "$(go env GOROOT):/opt/go:ro" \
            -e RELEASE_REF -e SOURCE_SHA -e GOARCH=${{ matrix.arch }} \
            debian:13 bash scripts/payincus/build-debian.sh
      - name: Inspect package and checksums
        run: |
          cd scripts/payincus/dist/release
          sha256sum --check SHA256SUMS
          dpkg-deb --info ./*.deb
          dpkg-deb --contents ./*.deb
      - name: Install package in a clean target system
        run: |
          docker run --rm -v "$PWD/scripts/payincus/dist/release:/packages:ro" ${{ matrix.image }} sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/*.deb
            incus-tui --version
            incus --version
            /usr/libexec/incus/incusd --version
            /usr/libexec/incus/payincus-agent -h
            getent group incus-admin
            getent group incus
            test -x /usr/libexec/incus/payincus-network-worker
          '
      - uses: actions/upload-artifact@v4
        with:
          name: payincus-linux-${{ matrix.target }}-${{ matrix.arch }}
          path: scripts/payincus/dist/release/*
          if-no-files-found: error

  publish:
    name: Publish integration prerelease
    if: startsWith(github.ref, 'refs/tags/payincus-v')
    needs: integration
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: payincus-linux-*
          path: release
          # Keep architecture-specific checksums and manifests separate.
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release -type f -name SHA256SUMS -execdir sha256sum --check SHA256SUMS \;
          for target in ubuntu-24.04 debian-13; do
            for arch in amd64 arm64; do
              mv "release/payincus-linux-$target-$arch/SHA256SUMS" "release/payincus-linux-$target-$arch/SHA256SUMS-$target-$arch"
            done
          done
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" \
            --title "PayIncus Incus ${GITHUB_REF_NAME#payincus-v}" \
            --notes-file scripts/payincus/RELEASE-NOTES.md \
            release/payincus-linux-*/*
